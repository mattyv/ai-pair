\* The code as it should be: a read that a later one overtook is dropped, a
\* change to keybindings.json starts a read, and a page that loads is sent the
\* labels the host holds. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    MaxEdits = 3
    MaxPages = 3
    MaxLength = 1
    DropStale = TRUE
    ReadOnChange = TRUE
    SendOnReady = TRUE
    NoKey = NoKey
    NoLabels = NoLabels

INVARIANTS
    TypeOK
    ShowsCache

PROPERTIES
    MonotoneProp
    Converges

CHECK_DEADLOCK TRUE
