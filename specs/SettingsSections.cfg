\* Four sections and two providers exercise all disclosure transitions.

SPECIFICATION Spec

CONSTANTS
    Sections = {conversation, playback, providerA, providerB}
    Defaults = {conversation, playback}
    Providers = {providerA, providerB}
    InitialProvider = providerA
    Invalid = {invalid}
    GuardDefaults = TRUE
    GuardSummaries = TRUE
    GuardFooter = TRUE
    GuardRestore = TRUE
    GuardProvider = TRUE
    GuardVisibility = TRUE

INVARIANTS
    TypeOK
    DefaultOpen
    AllSummariesReachable
    FooterVisible
    RestoresState
    SelectedProviderOnly
    SelectionOpens

CHECK_DEADLOCK TRUE
