\* The text a line sends to its speech model (#101): every line of three
\* providers, a model that takes tags and one that does not, an accent or none,
\* a delivery cue, neutral, or none, preview or not, context on or off, and
\* every text of up to three words, tags, and code spans. The
\* ASSUMEs are the checks, with nothing to explore (8.7). Expected to pass.

