    Providers = {"kokoro", "elevenlabs", "openrouter"}
    Models = {"tagged", "plain"}
    TagModels = {"tagged"}
    Accents = {"none", "australian"}
    NoAccent = "none"
    Deliveries = {"neutral", "excited"}
    NoDelivery = "nodelivery"
    MaxText = 3
