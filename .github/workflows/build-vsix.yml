name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Speech runs on CPU; do not download unused CUDA provider binaries.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  native:
    uses: ./.github/workflows/native-audio.yml

  # Each Mac build stages its own architecture's Kokoro runtime from the
  # runner's node_modules, so each target is packaged on its own runner (#39).
  vsix-macos:
    name: VSIX ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Package main extension
        run: npm run package -w packages/vscode -- --target ${{ matrix.target }}
      - name: Require the staged runtime for this target
        shell: bash
        run: |
          arch="${{ matrix.target }}"
          arch="${arch#darwin-}"
          expected="{\"available\":true,\"platform\":\"darwin\",\"arch\":\"${arch}\"}"
          test "$(cat packages/vscode/dist/speech/runtime.json)" == "${expected}"
      - name: Name the artifact
        id: artifact
        shell: bash
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          sha=$(git rev-parse --short=12 HEAD)
          name="ai-pair-${{ matrix.target }}-${version}-${sha}.vsix"
          mv "ai-pair-${{ matrix.target }}-${version}.vsix" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  vsix:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install isolated GPU runtime
        run: npm ci --prefix packages/audio-ui/gpu-runtime --workspaces=false --ignore-scripts
      - name: Stage verified GPU Node runtime
        shell: bash
        run: |
          curl --fail --location --proto '=https' --max-filesize 60000000 \
            https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/gpu-node.tar.xz"
          printf '%s  %s\n' \
            '1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce' \
            "$RUNNER_TEMP/gpu-node.tar.xz" | sha256sum --check
          mkdir -p packages/audio-ui/gpu-runtime/node_modules/.gpu-node
          tar -xJf "$RUNNER_TEMP/gpu-node.tar.xz" \
            -C packages/audio-ui/gpu-runtime/node_modules/.gpu-node --strip-components=1 \
            node-v22.23.4-linux-x64/bin/node node-v22.23.4-linux-x64/LICENSE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test packages/vscode/test/visual/chat_order.spec.ts
      # The reusable workflow runs for this same commit and uploads four uniquely named artifacts.
      - uses: actions/download-artifact@v7
        with:
          pattern: audio-*-compile-only
          path: ${{ runner.temp }}/native-audio
          merge-multiple: true
      - name: Require all universal companion helpers
        shell: bash
        run: |
          for name in audio-darwin-x64 audio-darwin-arm64 audio-win32-x64.exe audio-win32-arm64.exe; do
            test -s "$RUNNER_TEMP/native-audio/$name"
          done
      - name: Package main extension
        run: npm run package
      - name: Package local audio companion
        run: npm run package -w packages/audio-ui
        env:
          AI_PAIR_NATIVE_ASSETS: ${{ runner.temp }}/native-audio
          AI_PAIR_UNIVERSAL_AUDIO: "1"
      - name: Name paired artifacts
        id: artifact
        shell: bash
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          companion_version=$(node -p "require('./packages/audio-ui/package.json').version")
          test "$version" = "$companion_version"
          sha=$(git rev-parse --short=12 HEAD)
          main="ai-pair-${version}-${sha}.vsix"
          companion="ai-pair-local-audio-${version}-${sha}.vsix"
          mv "ai-pair-${version}.vsix" "$main"
          mv "ai-pair-local-audio-${version}.vsix" "$companion"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "companion=$companion" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.main }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.companion }}
          archive: false
          if-no-files-found: error
          retention-days: 14
