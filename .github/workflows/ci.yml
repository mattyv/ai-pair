# Lint, type check, unit tests, and the style of the shell scripts (#135), the panel's HTML and CSS
# (#132), and the Markdown (#136); the integration test in a real VS Code, downloaded, on a virtual
# display; the TLA+ specs (#7, #19); and the Swift lint and type check, on macOS (#137).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Speech runs on CPU; do not download unused CUDA provider binaries.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  check:
    # Debian trixie, in a container: it packages kcov, which the shell tests' coverage needs and
    # Ubuntu 24.04 does not carry. The actions need git, curl, and certificates in the container,
    # and Node's binary links libatomic.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Debian's packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git kcov libatomic1 shellcheck xz-utils
      - uses: actions/checkout@v7
      # The checkout's safe-directory entry lives in a temporary config that goes with its step; the
      # scripts run git too, as the container's root over files another user owns.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:ascii
      # Pin shfmt 3.14.1's release asset ID and SHA-256; ShellCheck is Debian's.
      - name: Install shfmt
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 --retry-max-time 600 \
            -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$RUNNER_TEMP/shfmt" \
            https://api.github.com/repos/mvdan/sh/releases/assets/547320883
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $RUNNER_TEMP/shfmt" | sha256sum -c
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm run lint:sh
      # vnu, the Nu Html Checker, runs on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm run lint:web
      - run: npm run lint:md
      - run: npm run lint:tla
      - run: npm run typecheck
      - run: npm run test:coverage
      # kcov traces bash line by line, for the shell scripts' tests.
      - run: npm run test:shell:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit-css-shell
          path: |
            coverage/unit
            coverage/css
            coverage/shell
            COVERAGE.md

  swift:
    # Xcode has swift-format, and the SDK with the frameworks the script imports.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint:swift
      - run: npm run typecheck:swift
      - run: npm run test:swift:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-swift
          path: coverage/swift
      # The panel's screenshots, against the baselines recorded on macOS.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: test-results

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The Electron IPC regression launches the same pinned standalone Node
      # and isolated GPU runtime as the packaged companion.
      - name: Install isolated GPU runtime
        run: npm ci --prefix packages/audio-ui/gpu-runtime --workspaces=false --ignore-scripts
      - name: Stage verified GPU Node runtime
        shell: bash
        run: |
          curl --fail --location --proto '=https' --max-filesize 60000000 \
            https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/gpu-node.tar.xz"
          printf '%s  %s\n' \
            '1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce' \
            "$RUNNER_TEMP/gpu-node.tar.xz" | sha256sum --check
          mkdir -p packages/audio-ui/gpu-runtime/node_modules/.gpu-node
          tar -xJf "$RUNNER_TEMP/gpu-node.tar.xz" \
            -C packages/audio-ui/gpu-runtime/node_modules/.gpu-node --strip-components=1 \
            node-v22.23.4-linux-x64/bin/node node-v22.23.4-linux-x64/LICENSE
      - name: Download VS Code
        run: echo "VSCODE_BIN=$(node scripts/vscode_bin.mts | tail -1)" >> "$GITHUB_ENV"
        working-directory: packages/vscode
      - name: Run the integration test, with coverage
        run: xvfb-run -a npm run test:integration:coverage
        env:
          VSCODE_ARGS: --no-sandbox --disable-gpu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-integration
          path: |
            coverage/integration/lcov.info
            coverage/integration/coverage-summary.json
            coverage/integration/v8/**
            COVERAGE.md

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether models are needed
        id: models
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          needed=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            needed=$(bash scripts/specs_needed.sh "$BASE_SHA" HEAD)
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.models.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 21
      # Pin the official v1.8.0 release asset ID: the named release asset is periodically replaced.
      - name: Download TLC
        if: steps.models.outputs.needed == 'true'
        run: |
          bash scripts/download_tlc.sh "$RUNNER_TEMP/tla2tools.jar" \
            e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f
      - name: Check every spec, with coverage
        if: steps.models.outputs.needed == 'true'
        run: specs/check.sh --coverage
        env:
          TLC: java -XX:+UseParallelGC -cp ${{ runner.temp }}/tla2tools.jar tlc2.TLC
      - uses: actions/upload-artifact@v7
        if: always() && steps.models.outputs.needed == 'true'
        with:
          name: coverage-tla
          path: coverage/tla
